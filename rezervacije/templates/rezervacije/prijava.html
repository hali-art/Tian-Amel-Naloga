{% extends 'rezervacije/base.html' %}

{% block naslov %}Prijava{% endblock %}

{% block vsebina %}
<div class="ozka">
    <div class="kartica obrazec">
        <h1>Prijava</h1>
        <p class="podnaslov">Prijavite se za rezervacijo termina.</p>
        <form method="post">
            {% csrf_token %}
            {% include 'rezervacije/_polja.html' %}
            <button type="submit" class="gumb gumb-poln gumb-velik">Prijava</button>
        </form>
        <p class="pod-obrazcem">Še nimate računa? <a href="{% url 'registracija' %}">Registrirajte se</a></p>
    </div>
</div>
{% endblock %}
