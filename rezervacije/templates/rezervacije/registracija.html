{% extends 'rezervacije/base.html' %}

{% block naslov %}Registracija{% endblock %}

{% block vsebina %}
<div class="ozka">
    <div class="kartica obrazec">
        <h1>Registracija</h1>
        <p class="podnaslov">Ustvarite račun in rezervirajte svoj prvi termin.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'rezervacije/_polja.html' %}
            <button type="submit" class="gumb gumb-poln gumb-velik">Registriraj se</button>
        </form>
        <p class="pod-obrazcem">Že imate račun? <a href="{% url 'prijava' %}">Prijavite se</a></p>
    </div>
</div>
{% endblock %}
